[project]
name = "pytwoway"
description = "Estimate two way fixed effect labor models"
readme = "README.rst"
license = "MIT"
requires-python = ">=3.13"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
authors = [{ name = "Thibaut Lamadon", email = "thibaut.lamadon@gmail.com" }]
dynamic = ["version"]
dependencies = [
    "numpy>=2.0",
    "pandas>=2.0",
    "numba>=0.61",
    "scipy>=1.14",
    "qpsolvers>=4.0",
    "pyamg>=5.0",
    "statsmodels>=0.14",
    "paramsdict>=0.0.3",
    "bipartitepandas>=1.1.3",
    "quadprog",
    "ConfigArgParse",
    "matplotlib",
    "tqdm",
]

[project.urls]
Homepage = "https://github.com/tlamadon/pytwoway"

[project.scripts]
pytw = "pytwoway.command_line:main"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "pytwoway/_version.py"

# =====================================================================================
# Pixi
# =====================================================================================

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-64", "osx-arm64", "win-64"]

[tool.pixi.dependencies]
python = ">=3.13"
numpy = ">=2.0"
pandas = ">=2.0"
numba = ">=0.61"
scipy = ">=1.14"
pyamg = ">=5.0"
qpsolvers = ">=4.0"
quadprog = "*"
statsmodels = ">=0.14"
configargparse = "*"
matplotlib = "*"
tqdm = "*"

[tool.pixi.pypi-dependencies]
paramsdict = ">=0.0.3"
bipartitepandas = ">=1.1.3"
pytwoway = { path = ".", editable = true }

# =====================================================================================
# Pixi features
# =====================================================================================

[tool.pixi.feature.tests.dependencies]
pytest = "*"
pytest-cov = "*"
pytest-xdist = "*"
ty = "*"

[tool.pixi.feature.tests.tasks]
tests = "pytest tests"
tests-with-cov = "pytest tests --cov-report=xml --cov=pytwoway/"
ty = "ty check"

[tool.pixi.feature.docs.dependencies]
sphinx = "*"
sphinx_rtd_theme = "*"
nbsphinx = "*"
jupyter = "*"

[tool.pixi.feature.docs.tasks]
docs = "make -C docs html"

# =====================================================================================
# Pixi environments
# =====================================================================================

[tool.pixi.environments]
default = { features = [], solve-group = "default" }
tests = { features = ["tests"], solve-group = "default" }
docs = { features = ["docs"], solve-group = "default" }

# =====================================================================================
# Pytest
# =====================================================================================

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
