version: 2.1

jobs:
  build-and-test:
    docker:
      - image: cimg/base:stable

    # Allow multiple tests to run in parallel (max 4 for free plans)
    parallelism: 4

    # Allocate more memory (source: https://circleci.com/docs/configuration-reference#resourceclass)
    resource_class: large

    steps:
      # Get the code
      - checkout

      # Install pixi
      - run:
          name: Install pixi
          command: curl -fsSL https://pixi.sh/install.sh | bash

      # Cache pixi environment
      - restore_cache:
          keys:
            - pixi-v1-{{ checksum "pyproject.toml" }}
            - pixi-v1-

      # Install dependencies
      - run:
          name: Install dependencies
          command: ~/.pixi/bin/pixi install -e tests

      - save_cache:
          key: pixi-v1-{{ checksum "pyproject.toml" }}
          paths:
            - .pixi

      # Run tests
      - run:
          name: Run PyTest
          no_output_timeout: 20m
          command: |
            circleci tests glob "tests/*.py" | circleci tests split --split-by=timings > /tmp/tests-to-run
            ~/.pixi/bin/pixi run -e tests pytest $(cat /tmp/tests-to-run)

      # Store test timing results so parallelism splits tests more efficiently
      - store_test_results:
          path: test-results

# In the workflows section, we specify when we want to run the jobs defined
workflows:
  version: 2

  # The build-and-test we will run EVERYTIME a piece of code changes
  build-and-test-workflow:
    jobs:
        - build-and-test:
            filters:
              branches:
                only: master
